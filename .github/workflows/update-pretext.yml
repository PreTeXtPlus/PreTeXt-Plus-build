name: Update PreTeXt CLI

# Pins `pretext` in requirements.txt to a PreTeXt CLI release, smoke-tests the
# API against it, and merges the pin into main through a pull request so the
# next deploy runs that CLI.
#
# Triggered by pretext-cli's deploy-stable workflow after each stable release
# (repository_dispatch "pretext-cli-release", payload {version}), or by hand.
#
# Opens and merges the PR with secrets.PRETEXT_UPDATE_TOKEN when set (so the
# merge can trigger other workflows), else GITHUB_TOKEN.
on:
  repository_dispatch:
    types: [pretext-cli-release]
  workflow_dispatch:
    inputs:
      pretext_version:
        description: "PreTeXt CLI version to pin (e.g. 2.54.0). Blank = latest on PyPI."
        required: false
        default: ""

concurrency:
  group: update-pretext
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.PRETEXT_UPDATE_TOKEN || github.token }}

      - name: Resolve PreTeXt CLI version
        id: cli
        env:
          VERSION: ${{ github.event.client_payload.version || inputs.pretext_version }}
        run: |
          if [ -z "$VERSION" ]; then
            VERSION=$(curl -fsSL https://pypi.org/pypi/pretext/json | jq -r .info.version)
          fi
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Not a stable PreTeXt CLI version: '$VERSION'"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Pin pretext in requirements.txt
        id: pin
        env:
          VERSION: ${{ steps.cli.outputs.version }}
        run: |
          sed -i -E "s/^pretext([^a-zA-Z0-9_-].*)?$/pretext==$VERSION/" requirements.txt
          grep -qx "pretext==$VERSION" requirements.txt || { echo "::error::No pretext line in requirements.txt"; exit 1; }
          if git diff --quiet requirements.txt; then
            echo "Already pinned to pretext==$VERSION."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Builds fetch Runestone Services info from the html-static release
      # matching the CLI's major.minor, which the CLI release triggers but
      # which takes a while to reach jsDelivr.
      - name: Wait for html-static
        if: steps.pin.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.cli.outputs.version }}
        run: |
          url="https://cdn.jsdelivr.net/gh/pretextbook/html-static@${VERSION%.*}/dist/_static/runestone_services.xml"
          for attempt in $(seq 1 45); do
            if curl -fsS -o /dev/null "$url"; then
              echo "html-static ${VERSION%.*} is available"
              exit 0
            fi
            echo "Attempt $attempt: $url not served yet; retrying in 2 minutes"
            sleep 120
          done
          echo "::error::html-static ${VERSION%.*} never appeared at $url"
          exit 1

      - uses: actions/setup-python@v7
        if: steps.pin.outputs.changed == 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.pin.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get -y install libcairo2-dev
          pip install -r requirements.txt

      - name: Smoke test
        if: steps.pin.outputs.changed == 'true'
        run: python scripts/smoke_test.py

      # main only accepts changes through a pull request, so open one for the
      # pin and merge it straight away.
      - name: Open and merge pull request
        if: steps.pin.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.cli.outputs.version }}
          GH_TOKEN: ${{ secrets.PRETEXT_UPDATE_TOKEN || github.token }}
        run: |
          branch="update-pretext/$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898208+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "chore(deps): pin pretext to $VERSION"
          git push --force origin "$branch"
          gh pr view "$branch" --json state --jq .state 2>/dev/null | grep -qx OPEN \
            || gh pr create --base main --head "$branch" \
                 --title "chore(deps): pin pretext to $VERSION" \
                 --body "Automated pin to PreTeXt CLI $VERSION. Smoke test passed."
          gh pr merge "$branch" --squash --delete-branch
